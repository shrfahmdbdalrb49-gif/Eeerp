name: Deploy Sharaf ERP to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build Sharaf ERP for Cloudflare (base path = /) into dist-cf-root
        run: ./build.sh

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Sanitize token (remove accidental newlines/spaces)
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" | tr -d '\n\r' | sed 's/ //g' >> $GITHUB_ENV

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy dist-cf-root --project-name=sharaf-erp --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
