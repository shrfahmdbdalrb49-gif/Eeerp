name: Deploy Sharaf ERP to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Enable Corepack and set pnpm version
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Build Sharaf ERP for Cloudflare (base path = /)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile --config.auto-install-peers=false || pnpm install --no-frozen-lockfile
          pnpm build:cf

      - name: Fix asset paths for Cloudflare root base
        run: |
          sed -i 's|/Eeerp/|/|g' dist-cf-root/index.html dist-cf-root/sw.js dist-cf-root/manifest.webmanifest 2>/dev/null || true
          ls -la dist-cf-root && head -c 300 dist-cf-root/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist-cf-root --project-name=sharaf-erp
