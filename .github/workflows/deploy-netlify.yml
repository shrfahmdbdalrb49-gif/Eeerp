name: Deploy Sharaf ERP to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Netlify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build Sharaf ERP (base path = /) into dist-cf-root
        run: ./build.sh

      - name: Sanitize Netlify token (remove accidental newlines/spaces)
        run: |
          echo "NETLIFY_AUTH_TOKEN=$(printf '%s' '${{ secrets.NETLIFY_AUTH_TOKEN }}' | tr -d '\n\r ')" >> $GITHUB_ENV
          echo "NETLIFY_SITE_ID=$(printf '%s' '${{ secrets.NETLIFY_SITE_ID }}' | tr -d '\n\r ')" >> $GITHUB_ENV

      - uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist-cf-root
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
        timeout-minutes: 10
