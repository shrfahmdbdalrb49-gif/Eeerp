[build]
builder = "RAILPACK"
rootDirectory = "."
watchPatterns = ["apps/server/**", "apps/web/**", "package.json", "railway.toml"]
[build.packages]
nodejs = "22"
[deploy]
startCommand = "node apps/server/server.js"
healthcheckPath = "/api/health"
healthcheckIntervalSeconds = 15
healthcheckTimeoutSeconds = 10
healthcheckPort = 4000
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
